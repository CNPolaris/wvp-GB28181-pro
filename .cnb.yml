# .cnb.yml
$:
  # vscode 事件：专供页面中启动远程开发用
  vscode:
    - docker:
        image: docker.cnb.cool/polaris-tian/wvp-docker:latest
        build: .ide/Dockerfile
        volumes:
          - /root/.m2:cow
          - node_modules:copy-on-write
      runner:
        cpus: 4
      services:
        - vscode
        - docker

"**":
  web_trigger_sync:
    - stages:
        - name: sync to github
          imports: https://cnb.cool/polaris-tian/my-token/-/blob/main/env.yml
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/CNPolaris/wvp-GB28181-pro.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_PASSWORD}
